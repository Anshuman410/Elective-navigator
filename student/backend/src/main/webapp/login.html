<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-soft: #ffffff;
            --accent-pink: #ffdae9;
            --accent-blue: #d4f1f9;
            --accent-indigo: #2c3e50;
            --accent-purple: #9b59b6;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #34495e;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Calm Floating Blobs Animation */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #fff;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
            filter: blur(100px);
            opacity: 0.3;
            animation: move 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: radial-gradient(circle, var(--accent-blue) 0%, transparent 70%);
            left: 50%;
            top: 20%;
            animation-delay: -5s;
        }

        @keyframes move {
            0% {
                transform: translate(-10%, -10%) scale(1);
            }

            100% {
                transform: translate(10%, 10%) scale(1.1);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            border-radius: 2.5rem;
        }

        input {
            background: #ffffff !important;
            border: 1px solid #eee !important;
            color: #333 !important;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #3f51b5 !important;
            box-shadow: 0 0 15px rgba(63, 81, 181, 0.05);
        }

        .btn-premium {
            background: linear-gradient(135deg, #2c3e50, #000);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body class="flex items-center justify-center p-6 bg-[#f8fafc]">

    <div class="mesh-bg">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="w-full max-w-md relative">
        <!-- Decoration -->
        <div class="absolute -top-12 -left-12 w-24 h-24 bg-indigo-500/10 rounded-full blur-2xl animate-pulse"></div>
        <div class="absolute -bottom-12 -right-12 w-24 h-24 bg-purple-500/10 rounded-full blur-2xl animate-pulse"
            style="animation-delay: 1s;"></div>

        <div class="glass-card relative z-10">
            <div class="mb-10 text-center">
                <h1 class="text-3xl font-black tracking-tight mb-2 text-slate-900">Welcome Back</h1>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Registry Authentication</p>
            </div>

            <form action="LoginLink" method="post" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Student
                        ID</label>
                    <input type="text" name="studentId" id="loginStudentId" required placeholder="Enter your ID"
                        class="w-full px-6 py-4 rounded-2xl outline-none border transition-all">
                </div>

                <div class="space-y-2 relative">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                        <button type="button" onclick="openChangePasswordModal()" class="text-xs font-bold text-indigo-500 hover:text-indigo-600 transition-colors">Forgot Password?</button>
                    </div>
                    <input type="password" name="password" id="loginPassword" required placeholder="••••••••"
                        class="w-full px-6 py-4 rounded-2xl outline-none border transition-all">
                </div>

                <button type="submit" id="loginBtn" class="btn-premium w-full py-5 rounded-2xl font-black text-lg mt-4">
                    Authenticate
                </button>
                <div id="loginMessageBox" class="mt-6 hidden p-4 rounded-xl text-sm font-medium text-center"></div>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-100 text-center">
                <p class="text-slate-500 font-semibold mb-4 text-sm">New to the Navigator?</p>
                <a href="register.html"
                    class="inline-block px-10 py-4 rounded-2xl border border-indigo-100 text-indigo-600 font-bold hover:bg-slate-50 transition-all text-sm">
                    Create Account
                </a>
            </div>
        </div>
    </div>

    <!-- Change/Forgot Password Modal -->
    <div id="changePasswordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center fade-in">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl relative">
            <button onclick="closeChangePasswordModal()" class="absolute top-4 right-4 text-slate-400 hover:text-rose-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            
            <h2 class="text-2xl font-black text-slate-800 mb-2">Reset Password</h2>
            <p class="text-sm text-slate-500 mb-6 font-semibold">Enter your Student ID. We'll send a 6-digit OTP to your registered email address.</p>
            
            <!-- Step 1: Request OTP -->
            <div id="requestOtpStep" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Student ID</label>
                    <input type="text" id="forgotStudentId" class="w-full rounded-2xl px-5 py-4" placeholder="Enter Student ID">
                </div>
                <button type="button" onclick="sendOtpForPasswordChange()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-500 transition-all shadow-md">
                    Send OTP to Email
                </button>
            </div>

            <!-- Step 2: Verify & Change -->
            <div id="verifyOtpStep" class="hidden space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Enter OTP</label>
                    <input type="text" id="otpCode" class="w-full rounded-2xl px-5 py-4 tracking-widest text-center font-bold text-lg" placeholder="000000" maxlength="6">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">New Password</label>
                    <input type="password" id="newPassword" class="w-full rounded-2xl px-5 py-4" placeholder="Enter new password">
                </div>
                <button type="button" onclick="verifyAndChangePassword()" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold hover:bg-emerald-400 transition-all shadow-md mt-4">
                    Verify & Update Password
                </button>
            </div>
            
            <div id="modalAlert" class="mt-4 hidden p-3 rounded-xl text-sm font-bold text-center"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', handleLogin);
    </script>
</body>

</html>
