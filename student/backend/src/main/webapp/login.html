<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-arctic: #f8fafc;
            --accent-indigo: #4338ca;
            --accent-purple: #7c3aed;
            --glass-white: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(99, 102, 241, 0.1);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-arctic);
            color: #1e293b;
            min-height: screen;
            overflow: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.15;
            background: radial-gradient(circle at 10% 20%, #6366f1 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, #a855f7 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.05);
        }

        input {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            transition: all 0.3s ease;
            color: #1e293b !important;
        }

        input:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
            background: #fff !important;
            outline: none;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 bg-[#f8fafc]">

    <div class="mesh-bg"></div>

    <div class="w-full max-w-md relative">
        <!-- Decoration -->
        <div class="absolute -top-12 -left-12 w-24 h-24 bg-indigo-500/10 rounded-full blur-2xl animate-pulse"></div>
        <div class="absolute -bottom-12 -right-12 w-24 h-24 bg-purple-500/10 rounded-full blur-2xl animate-pulse" style="animation-delay: 1s;"></div>

        <div class="glass-card p-10 rounded-[2.5rem] relative overflow-hidden">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-indigo-600 transition-colors mb-10 group">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span class="text-sm font-bold uppercase tracking-widest">Back to Portal</span>
            </a>

            <div class="mb-10">
                <h1 class="text-4xl font-black mb-3 tracking-tight text-slate-900">Welcome Back</h1>
                <p class="text-slate-500 font-semibold italic">Continue your academic journey with precision.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-500 ml-1">Student ID</label>
                    <input type="text" id="loginStudentId" required class="w-full rounded-2xl px-5 py-4 placeholder-slate-400 focus:outline-none" placeholder="Enter ID (e.g. STU101)">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-xs font-black uppercase tracking-widest text-slate-500">Secure Password</label>
                        <a href="#" class="text-xs font-bold text-indigo-600 hover:text-indigo-500 transition-colors">Forgot?</a>
                    </div>
                    <input type="password" id="loginPassword" required class="w-full rounded-2xl px-5 py-4 placeholder-slate-400 focus:outline-none" placeholder="••••••••">
                </div>

                <button type="submit" id="loginBtn" class="btn-premium w-full py-5 rounded-2xl text-white font-black text-lg shadow-xl shadow-indigo-500/20">
                    Access Dashboard
                </button>
                
                <div id="loginMessageBox" class="hidden p-4 rounded-2xl text-sm font-bold text-center border"></div>
            </form>

            <p class="mt-10 text-center text-slate-500 text-sm font-semibold">
                New to the platform? <a href="register.html" class="text-indigo-600 hover:text-indigo-500 font-black transition-colors">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
