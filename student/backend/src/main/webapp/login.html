<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-[#0a0c10] text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-[30%] left-[10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[128px]"></div>
        <div class="absolute bottom-[20%] right-[10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px]"></div>
    </div>

    <div class="w-full max-w-md glass p-8 rounded-[2rem] shadow-2xl relative">
        
        <a href="index.html" class="absolute top-8 left-8 text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>

        <div class="text-center mb-10 mt-6">
            <h2 class="text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-400">Welcome Back</h2>
            <p class="text-slate-400 text-sm">Please sign in to access your dashboard.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Student ID</label>
                <input type="text" id="loginStudentId" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Student ID">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between">
                    <label class="text-sm font-medium text-slate-300">Password</label>
                    <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="••••••••">
            </div>

            <div class="pt-4">
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20 flex justify-center items-center gap-2">
                    Sign In
                </button>
            </div>
            
            <div id="loginMessageBox" class="hidden p-4 rounded-xl text-sm font-medium text-center"></div>

        </form>

        <p class="mt-8 text-center text-sm text-slate-400">
            Don't have an account? <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Register here</a>
        </p>

    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
