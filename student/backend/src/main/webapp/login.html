<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #050505;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-obsidian);
            color: #e2e8f0;
            min-height: screen;
            overflow: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.4;
            background: radial-gradient(circle at 10% 20%, var(--accent-indigo) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, var(--accent-purple) 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 bg-[#050505]">

    <div class="mesh-bg"></div>

    <div class="w-full max-w-md relative">
        <!-- Decoration -->
        <div class="absolute -top-12 -left-12 w-24 h-24 bg-indigo-500/20 rounded-full blur-2xl animate-pulse"></div>
        <div class="absolute -bottom-12 -right-12 w-24 h-24 bg-purple-500/20 rounded-full blur-2xl animate-pulse" style="animation-delay: 1s;"></div>

        <div class="glass-card p-10 rounded-[2.5rem] relative overflow-hidden">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-white transition-colors mb-10 group">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span class="text-sm font-bold uppercase tracking-widest">Back to Portal</span>
            </a>

            <div class="mb-10">
                <h1 class="text-4xl font-extrabold mb-3 tracking-tight">Welcome Back</h1>
                <p class="text-slate-400 font-medium">Continue your academic journey with precision.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Student ID</label>
                    <input type="text" id="loginStudentId" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600 focus:outline-none" placeholder="Enter ID (e.g. STU101)">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-500">Secure Password</label>
                        <a href="#" class="text-xs font-bold text-indigo-400 hover:text-indigo-300">Forgot?</a>
                    </div>
                    <input type="password" id="loginPassword" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600 focus:outline-none" placeholder="••••••••">
                </div>

                <button type="submit" id="loginBtn" class="btn-premium w-full py-5 rounded-2xl text-white font-black text-lg shadow-xl shadow-indigo-500/20">
                    Access Dashboard
                </button>
                
                <div id="loginMessageBox" class="hidden p-4 rounded-2xl text-sm font-bold text-center border"></div>
            </form>

            <p class="mt-10 text-center text-slate-500 text-sm font-medium">
                New to the platform? <a href="register.html" class="text-white hover:text-indigo-400 font-bold transition-colors">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
