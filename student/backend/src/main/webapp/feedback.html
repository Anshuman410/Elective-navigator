<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Feedback | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-arctic: #f8fafc;
            --accent-indigo: #4338ca;
            --accent-purple: #7c3aed;
            --glass-white: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(99, 102, 241, 0.1);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-arctic);
            color: #1e293b;
            overflow-x: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(120px);
            opacity: 0.15;
            background: radial-gradient(circle at 10% 20%, #6366f1 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, #a855f7 0%, transparent 40%);
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0, 0, 0, 0.05) !important;
            transition: all 0.3s ease;
            color: #1e293b !important;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            background: #fff !important;
            outline: none;
        }

        .rating-btn {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .rating-btn.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-indigo);
            transform: scale(1.1);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2);
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex selection:bg-indigo-500/30">

    <div class="mesh-bg"></div>

    <!-- Sidebar -->
    <aside class="w-72 glass-sidebar hidden lg:flex flex-col sticky top-0 h-screen z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-10">
                <span class="text-xl font-bold tracking-tight text-indigo-950 leading-none">Elective Navigator</span>
            </div>
            
            <nav class="space-y-2">
                <a href="dashboard.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-500 hover:text-indigo-600 hover:bg-indigo-50/50 transition-all font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard
                </a>
                <a href="feedback.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl bg-indigo-50 text-indigo-600 border border-indigo-100 font-bold transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Feedback
                </a>
            </nav>
        </div>

        <div class="mt-auto p-8 border-t border-slate-100">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-3 py-4 rounded-2xl bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white border border-rose-100 transition-all font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow min-h-screen px-6 md:px-12 py-10 lg:pl-12">
        <div class="max-w-4xl mx-auto">
            
            <header class="mb-16">
                <h1 class="text-5xl font-black tracking-tighter mb-4 text-slate-900">Subject Feedback</h1>
                <p class="text-slate-500 font-semibold">Contribute to the collective intelligence of our academic community.</p>
            </header>

            <div class="glass-card p-10 md:p-16 rounded-[3rem] shadow-xl space-y-12">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="space-y-3">
                        <label class="text-xs font-black uppercase tracking-[0.2em] text-slate-500 ml-1">Previous Semester</label>
                        <select id="prevSemester" onchange="loadPrevSubjects()" class="w-full rounded-2xl px-6 py-5 cursor-pointer appearance-none">
                            <option value="" disabled selected>Initial Registry</option>
                        </select>
                    </div>

                    <div class="space-y-3">
                        <label class="text-xs font-black uppercase tracking-[0.2em] text-slate-500 ml-1">Curriculum Subject</label>
                        <select id="prevSubject" disabled class="w-full rounded-2xl px-6 py-5 cursor-pointer appearance-none disabled:opacity-30">
                            <option value="" disabled selected>Registry Locked</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-6">
                    <label class="text-xs font-black uppercase tracking-[0.2em] text-slate-500 ml-1">Experience Rating</label>
                    <div class="flex gap-4 md:gap-6">
                        <button onclick="setRating(1)" class="rating-btn w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl text-2xl group" data-val="1">⭐</button>
                        <button onclick="setRating(2)" class="rating-btn w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl text-2xl group" data-val="2">⭐</button>
                        <button onclick="setRating(3)" class="rating-btn w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl text-2xl group" data-val="3">⭐</button>
                        <button onclick="setRating(4)" class="rating-btn w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl text-2xl group" data-val="4">⭐</button>
                        <button onclick="setRating(5)" class="rating-btn w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl text-2xl group" data-val="5">⭐</button>
                    </div>
                    <input type="hidden" id="ratingValue" value="0">
                </div>

                <div class="space-y-3">
                    <label class="text-xs font-black uppercase tracking-[0.2em] text-slate-500 ml-1">Qualitative Feedback</label>
                    <textarea id="feedbackComment" rows="5" class="w-full rounded-[2rem] px-8 py-6 placeholder-slate-400 outline-none" placeholder="Provide analytical insights into content depth, instructional quality, and evaluation standards..."></textarea>
                </div>

                <div class="pt-6">
                    <button onclick="submitFeedback()" id="feedbackBtn" class="btn-premium w-full py-6 rounded-2xl text-white font-black text-lg tracking-tight transition-all">
                        Commit Intelligence
                    </button>
                </div>

                <div id="feedbackMsg" class="hidden p-6 rounded-2xl text-sm font-black text-center border-2"></div>
            </div>

            <p class="mt-16 text-center text-slate-400 text-sm font-bold uppercase tracking-widest opacity-50">
                Encrypted Anonymous Submission Protocol Secured
            </p>

        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentDataStr = localStorage.getItem('studentData');
            if (!studentDataStr) { window.location.href = 'login.html'; return; }
            const studentData = JSON.parse(studentDataStr);
            const currentSem = parseInt(studentData.semester);
            
            const select = document.getElementById('prevSemester');
            for(let i=1; i < currentSem; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Semester ${i}`;
                select.appendChild(opt);
            }
            if(currentSem <= 1) {
                select.innerHTML = '<option value="" disabled selected>No Historical Semesters</option>';
            }
        });

        async function loadPrevSubjects() {
            const sem = document.getElementById('prevSemester').value;
            const subSelect = document.getElementById('prevSubject');
            subSelect.disabled = true;
            subSelect.innerHTML = '<option value="" disabled selected>Initializing...</option>';

            try {
                const response = await fetch(`${API_BASE_URL}/api/electives?semester=${sem}`);
                const data = await response.json();
                if (data.success && data.data) {
                    subSelect.innerHTML = '<option value="" disabled selected>Identify Subject</option>';
                    data.data.forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub.subjectName;
                        opt.textContent = sub.subjectName;
                        subSelect.appendChild(opt);
                    });
                    subSelect.disabled = false;
                }
            } catch (e) {
                subSelect.innerHTML = '<option value="" disabled selected>Registry Error</option>';
            }
        }

        let currentRating = 0;
        function setRating(val) {
            currentRating = val;
            document.getElementById('ratingValue').value = val;
            document.querySelectorAll('.rating-btn').forEach(btn => {
                const btnVal = parseInt(btn.getAttribute('data-val'));
                if(btnVal <= val) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        async function submitFeedback() {
            const studentData = JSON.parse(localStorage.getItem('studentData'));
            const subject = document.getElementById('prevSubject').value;
            const semester = document.getElementById('prevSemester').value;
            const comment = document.getElementById('feedbackComment').value.trim();
            const rating = document.getElementById('ratingValue').value;
            const btn = document.getElementById('feedbackBtn');
            const msg = document.getElementById('feedbackMsg');

            if(!subject || !rating || rating == "0" || !comment) {
                alert("Please provide complete metrics and qualitative data.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "COMMITTING DATA...";

            try {
                const response = await fetch(`${API_BASE_URL}/api/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentId: studentData.studentId,
                        subjectName: subject,
                        semester: semester,
                        rating: rating,
                        comment: comment
                    })
                });
                const data = await response.json();
                if(data.success) {
                    msg.className = "p-6 rounded-2xl text-sm font-black text-center bg-emerald-500/10 text-emerald-600 border-emerald-500/20 mt-10";
                    msg.textContent = "INTELLIGENCE COMMITTED SUCCESSFULLY. REDIRECTING.";
                    msg.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
                } else {
                    throw new Error(data.message);
                }
            } catch (e) {
                msg.className = "p-6 rounded-2xl text-sm font-black text-center bg-rose-500/10 text-rose-600 border-rose-500/20 mt-10";
                msg.textContent = e.message.toUpperCase();
                msg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = "COMMIT INTELLIGENCE";
            }
        }
    </script>
</body>
</html>
