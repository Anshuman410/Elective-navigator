<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #050505;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-obsidian);
            color: #e2e8f0;
            min-height: screen;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.4;
            background: radial-gradient(circle at 10% 20%, var(--accent-indigo) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, var(--accent-purple) 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input, select {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
            color: white !important;
        }

        input:focus, select:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        .section-tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-indigo);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 py-20 bg-[#050505]">

    <div class="mesh-bg"></div>

    <div class="w-full max-w-4xl relative">
        <div class="glass-card p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden">
            
            <div class="mb-12">
                <span class="section-tag mb-4 inline-block">Security Verified</span>
                <h1 class="text-4xl font-extrabold mb-3 tracking-tight">Complete Your Identity</h1>
                <p class="text-slate-400 font-medium">Please provide your academic and personal details to unlock the full potential of your portal.</p>
            </div>

            <form id="setupProfileForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <!-- Personal Group -->
                <div class="lg:col-span-3 border-b border-white/5 pb-4 mb-2">
                    <h3 class="text-sm font-black text-white/50 uppercase tracking-widest">Personal Information</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Personal Email</label>
                    <input type="email" id="personalEmail" required class="w-full rounded-xl px-5 py-4" placeholder="name@personal.com">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Phone Number</label>
                    <input type="tel" id="phone" required class="w-full rounded-xl px-5 py-4" placeholder="+91 00000 00000">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Date of Birth</label>
                    <input type="date" id="dob" required class="w-full rounded-xl px-5 py-4">
                </div>

                <!-- Parental Group -->
                <div class="lg:col-span-3 border-b border-white/5 pb-4 mt-8 mb-2">
                    <h3 class="text-sm font-black text-white/50 uppercase tracking-widest">Parental Details</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Father's Name</label>
                    <input type="text" id="fatherName" required class="w-full rounded-xl px-5 py-4" placeholder="Arvind Kumar Sharma">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Mother's Name</label>
                    <input type="text" id="motherName" required class="w-full rounded-xl px-5 py-4" placeholder="Priyanka Parashar">
                </div>

                <!-- Academic Group -->
                <div class="lg:col-span-3 border-b border-white/5 pb-4 mt-8 mb-2">
                    <h3 class="text-sm font-black text-white/50 uppercase tracking-widest">Academic Information</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Official Email</label>
                    <input type="email" id="officialEmail" required class="w-full rounded-xl px-5 py-4" placeholder="id@college.ac.in">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">College/University</label>
                    <input type="text" id="college" required class="w-full rounded-xl px-5 py-4" placeholder="Graphic Era University">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Course Path</label>
                    <input type="text" id="course" required class="w-full rounded-xl px-5 py-4" placeholder="Bachelor of Technology">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Branch</label>
                    <input type="text" id="branch" required class="w-full rounded-xl px-5 py-4" placeholder="Computer Science">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Specialization</label>
                    <input type="text" id="specialization" class="w-full rounded-xl px-5 py-4" placeholder="AI / Data Science (Optional)">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Active Semester</label>
                    <select id="semester" required class="w-full rounded-xl px-5 py-4 cursor-pointer appearance-none">
                        <option value="" disabled selected class="bg-[#050505]">Select Semester</option>
                        <option value="1" class="bg-[#050505]">1st Semester</option>
                        <option value="2" class="bg-[#050505]">2nd Semester</option>
                        <option value="3" class="bg-[#050505]">3rd Semester</option>
                        <option value="4" class="bg-[#050505]">4th Semester</option>
                        <option value="5" class="bg-[#050505]">5th Semester</option>
                        <option value="6" class="bg-[#050505]">6th Semester</option>
                        <option value="7" class="bg-[#050505]">7th Semester</option>
                        <option value="8" class="bg-[#050505]">8th Semester</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Section</label>
                    <input type="text" id="section" required class="w-full rounded-xl px-5 py-4" placeholder="SEC-F">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Class Roll No.</label>
                    <input type="text" id="classRollNo" required class="w-full rounded-xl px-5 py-4" placeholder="11">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Enrollment No.</label>
                    <input type="text" id="enrollNo" required class="w-full rounded-xl px-5 py-4" placeholder="GE-242025091">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">University Roll No.</label>
                    <input type="text" id="universityRollNo" required class="w-full rounded-xl px-5 py-4" placeholder="2025091">
                </div>

                <div class="lg:col-span-3 pt-12 flex flex-col md:flex-row gap-6">
                    <button type="submit" id="saveProfileBtn" class="btn-premium flex-grow py-5 rounded-2xl text-white font-black text-lg shadow-xl shadow-indigo-500/20">
                        Finalize Clinical Identity
                    </button>
                    <button type="button" onclick="logout()" class="px-10 py-5 rounded-2xl bg-white/5 border border-white/10 text-slate-400 font-bold hover:text-white transition-all">
                        Sign Out
                    </button>
                </div>
                
                <div id="setupMessageBox" class="lg:col-span-3 hidden p-6 rounded-2xl text-sm font-bold text-center border"></div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentData = JSON.parse(localStorage.getItem('studentData'));
            if (!studentData) {
                window.location.href = 'login.html';
                return;
            }
            // Pre-fill existing data if any
            const fields = ['name', 'fatherName', 'motherName', 'dob', 'personalEmail', 'officialEmail', 'phone', 'college', 'course', 'branch', 'specialization', 'semester', 'section', 'classRollNo', 'enrollNo', 'universityRollNo'];
            fields.forEach(f => {
                if (studentData[f] && document.getElementById(f)) {
                    document.getElementById(f).value = studentData[f];
                }
            });
        });

        document.getElementById('setupProfileForm').addEventListener('submit', handleUpdateProfile);
    </script>
</body>
</html>
