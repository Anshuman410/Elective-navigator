<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-arctic: #f8fafc;
            --accent-indigo: #4338ca;
            --accent-purple: #7c3aed;
            --glass-white: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(99, 102, 241, 0.1);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-arctic);
            color: #1e293b;
            min-height: screen;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.15;
            background: radial-gradient(circle at 10% 20%, #6366f1 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, #a855f7 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }

        input, select {
            background: rgba(255, 255, 255, 0.8) !important;
            border: 1px solid rgba(0, 0, 0, 0.05) !important;
            transition: all 0.3s ease;
            color: #1e293b !important;
        }

        input:focus, select:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
            outline: none;
            background: #fff !important;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .section-tag {
            background: rgba(99, 102, 241, 0.05);
            color: var(--accent-indigo);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 py-20 bg-[#f8fafc]">

    <div class="mesh-bg"></div>

    <div class="w-full max-w-4xl relative">
        <div class="glass-card p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden">
            
            <div class="mb-12">
                <span class="section-tag mb-4 inline-block">Security Verified</span>
                <h1 class="text-4xl font-black mb-3 tracking-tight text-slate-900">Complete Your Identity</h1>
                <p class="text-slate-500 font-semibold">Please provide your academic and personal details to unlock the full potential of your portal.</p>
            </div>

            <form id="setupProfileForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <!-- Personal Group -->
                <div class="lg:col-span-3 border-b border-slate-100 pb-4 mb-2">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest">Personal Information</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Personal Email</label>
                    <input type="email" id="personalEmail" required class="w-full rounded-xl px-5 py-4" placeholder="name@personal.com">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Phone Number</label>
                    <input type="tel" id="phone" required class="w-full rounded-xl px-5 py-4" placeholder="+91 00000 00000">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Date of Birth</label>
                    <input type="date" id="dob" required class="w-full rounded-xl px-5 py-4">
                </div>

                <!-- Parental Group -->
                <div class="lg:col-span-3 border-b border-slate-100 pb-4 mt-8 mb-2">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest">Parental Details</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Father's Name</label>
                    <input type="text" id="fatherName" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Father Name">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Mother's Name</label>
                    <input type="text" id="motherName" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Mother Name">
                </div>

                <!-- Academic Group -->
                <div class="lg:col-span-3 border-b border-slate-100 pb-4 mt-8 mb-2">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest">Academic Information</h3>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Official Email</label>
                    <input type="email" id="officialEmail" required class="w-full rounded-xl px-5 py-4" placeholder="id@college.ac.in">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">College/University</label>
                    <input type="text" id="college" required class="w-full rounded-xl px-5 py-4" placeholder="Enter College/University Name">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Course Path</label>
                    <input type="text" id="course" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Course Name">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Branch</label>
                    <input type="text" id="branch" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Branch Name">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Specialization</label>
                    <input type="text" id="specialization" class="w-full rounded-xl px-5 py-4" placeholder="Enter Specialization (Optional)">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Active Semester</label>
                    <select id="semester" required class="w-full rounded-xl px-5 py-4 cursor-pointer appearance-none">
                        <option value="" disabled selected>Select Semester</option>
                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                        <option value="3">3rd Semester</option>
                        <option value="4">4th Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="6">6th Semester</option>
                        <option value="7">7th Semester</option>
                        <option value="8">8th Semester</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Section</label>
                    <input type="text" id="section" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Section">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Class Roll No.</label>
                    <input type="text" id="classRollNo" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Class Roll No.">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Enrollment No.</label>
                    <input type="text" id="enrollNo" required class="w-full rounded-xl px-5 py-4" placeholder="Enter Enrollment No.">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">University Roll No.</label>
                    <input type="text" id="universityRollNo" required class="w-full rounded-xl px-5 py-4" placeholder="Enter University Roll No.">
                </div>

                <div class="lg:col-span-3 pt-12 flex flex-col md:flex-row gap-6">
                    <button type="submit" id="saveProfileBtn" class="btn-premium flex-grow py-5 rounded-2xl text-white font-black text-lg shadow-xl shadow-indigo-500/20">
                        Finalize Clinical Identity
                    </button>
                    <button type="button" onclick="logout()" class="px-10 py-5 rounded-2xl bg-rose-50 border border-rose-100 text-rose-500 font-bold hover:bg-rose-500 hover:text-white transition-all">
                        Sign Out
                    </button>
                </div>
                
                <div id="setupMessageBox" class="lg:col-span-3 hidden p-6 rounded-2xl text-sm font-bold text-center border"></div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentData = JSON.parse(localStorage.getItem('studentData'));
            if (!studentData) {
                window.location.href = 'login.html';
                return;
            }
            // Pre-fill existing data if any
            const fields = ['name', 'fatherName', 'motherName', 'dob', 'personalEmail', 'officialEmail', 'phone', 'college', 'course', 'branch', 'specialization', 'semester', 'section', 'classRollNo', 'enrollNo', 'universityRollNo'];
            fields.forEach(f => {
                if (studentData[f] && document.getElementById(f)) {
                    document.getElementById(f).value = studentData[f];
                }
            });
        });

        document.getElementById('setupProfileForm').addEventListener('submit', handleUpdateProfile);
    </script>
</body>
</html>
