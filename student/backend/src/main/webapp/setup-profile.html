<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Identity | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-soft: #ffffff;
            --accent-pink: #ffdae9;
            --accent-blue: #d4f1f9;
            --accent-indigo: #2c3e50;
            --accent-purple: #9b59b6;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #34495e;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Calm Floating Blobs Animation */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #fff;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
            filter: blur(100px);
            opacity: 0.3;
            animation: move 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: radial-gradient(circle, var(--accent-blue) 0%, transparent 70%);
            left: 50%;
            top: 20%;
            animation-delay: -5s;
        }

        @keyframes move {
            0% {
                transform: translate(-10%, -10%) scale(1);
            }

            100% {
                transform: translate(10%, 10%) scale(1.1);
            }
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        input,
        select {
            background: #ffffff !important;
            border: 1px solid #eee !important;
            color: #333 !important;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            border-color: #3f51b5 !important;
            box-shadow: 0 0 20px rgba(63, 81, 181, 0.05);
            outline: none;
        }

        .btn-premium {
            background: linear-gradient(135deg, #2c3e50, #000);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body class="flex min-h-screen selection:bg-indigo-500/20">

    <div class="mesh-bg">
        <div class="blob"></div>
        <div class="blob-2"></div>
    </div>

    <!-- Sidebar -->
    <aside class="w-72 glass-sidebar hidden lg:flex flex-col sticky top-0 h-screen z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-10">
                <span class="text-xl font-bold tracking-tight text-slate-800 leading-none">Elective Navigator</span>
            </div>

            <nav class="space-y-2">
                <a href="dashboard.html"
                    class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-500 hover:text-indigo-600 hover:bg-slate-50 transition-all font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    Dashboard
                </a>
                <a href="feedback.html"
                    class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-500 hover:text-indigo-600 hover:bg-slate-50 transition-all font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
                        </path>
                    </svg>
                    Feedback
                </a>
                <a href="setup-profile.html"
                    class="flex items-center gap-4 px-6 py-4 rounded-2xl bg-indigo-50 text-indigo-700 border border-indigo-100 font-bold transition-all shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                        </path>
                    </svg>
                    Edit Identity
                </a>
            </nav>
        </div>
        <div class="mt-auto p-8 border-t border-slate-100">
            <button onclick="logout()"
                class="w-full flex items-center justify-center gap-3 py-4 rounded-2xl bg-slate-100 hover:bg-rose-500 text-slate-600 hover:text-white transition-all font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <main class="flex-grow min-h-screen px-6 md:px-12 py-10 lg:pl-12">
        <div class="max-w-5xl mx-auto">

            <header class="mb-12">
                <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2 text-slate-900">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">Identity
                        Registry</span>
                </h1>
                <p class="text-slate-500 font-semibold italic">Configure your academic signature for precise elective
                    mapping.</p>
            </header>

            <!-- Profile Image Section -->
            <div class="flex flex-col items-center justify-center mb-12">
                <div class="relative group">
                    <div class="w-32 h-32 rounded-full border-4 border-indigo-500/20 p-1 overflow-hidden transition-all group-hover:border-indigo-500"
                        id="imgPreviewContainer">
                        <img id="profilePreview" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                            class="w-full h-full object-cover rounded-full" alt="Profile">
                    </div>
                    <label for="profileImageInput"
                        class="absolute bottom-0 right-0 bg-indigo-600 text-white p-2 rounded-full cursor-pointer shadow-lg hover:bg-indigo-500 transition-all active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </label>
                    <input type="file" id="profileImageInput" class="hidden" accept="image/*"
                        onchange="previewImage(this)">
                </div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-4">Upload Profile Picture
                </p>
            </div>

            <form id="setupProfileForm" class="space-y-12">

                <!-- Section: Personal -->
                <div class="space-y-8">
                    <div class="border-b border-slate-100 pb-4">
                        <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest">Personal Core</h3>
                    </div>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Full
                                Name</label>
                            <input type="text" id="name" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Enter Full Name">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Father's
                                Name</label>
                            <input type="text" id="fatherName" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Father's Name">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Mother's
                                Name</label>
                            <input type="text" id="motherName" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Mother's Name">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Date of
                                Birth</label>
                            <input type="date" id="dob" required class="w-full rounded-2xl px-5 py-4">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Personal
                                Email</label>
                            <input type="email" id="personalEmail" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="name@email.com">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Phone
                                Number</label>
                            <input type="tel" id="phone" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="+91 00000 00000">
                        </div>
                    </div>
                </div>

                <!-- Section: Academic -->
                <div class="space-y-8">
                    <div class="border-b border-slate-100 pb-4">
                        <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest">Academic Trajectory</h3>
                    </div>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Official
                                Email</label>
                            <input type="email" id="officialEmail" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="id@university.edu">
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">University</label>
                            <select id="college" required class="w-full rounded-2xl px-5 py-4 appearance-none">
                                <option value="" disabled selected>Select University</option>
                                <option value="Graphic Era (Deemed to be University), Dehradun">Graphic Era (Deemed to be
                                    University), Dehradun</option>
                                <option value="Graphic Era Hill University, Dehradun">Graphic Era Hill University,
                                    Dehradun</option>
                                <option value="Graphic Era Hill University, Bhimtal">Graphic Era Hill University,
                                    Bhimtal</option>
                                <option value="Graphic Era Hill University, Haldwani">Graphic Era Hill University,
                                    Haldwani</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Degree/Course</label>
                            <select id="course" required class="w-full rounded-2xl px-5 py-4 appearance-none">
                                <option value="" disabled selected>Select Course</option>
                                <option value="BTech">BTech</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Branch/Stream</label>
                            <select id="branch" required class="w-full rounded-2xl px-5 py-4 appearance-none">
                                <option value="" disabled selected>Select Branch</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Specialization</label>
                            <select id="specialization" required class="w-full rounded-2xl px-5 py-4 appearance-none">
                                <option value="" disabled selected>Select Specialization</option>
                                <option value="CORE">CORE</option>
                                <option value="AI">AI</option>
                                <option value="AIML">AIML</option>
                                <option value="AIDS">AIDS</option>
                                <option value="CYBER">CYBER</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Current
                                Semester</label>
                            <select id="semester" required class="w-full rounded-2xl px-5 py-4 appearance-none">
                                <option value="" disabled selected>Phase Select</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Section</label>
                            <input type="text" id="section" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="A, B, C...">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Class Roll
                                No</label>
                            <input type="text" id="classRollNo" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Class Roll">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Enrollment
                                No</label>
                            <input type="text" id="enrollNo" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Enrollment No">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">University
                                Roll</label>
                            <input type="text" id="universityRollNo" required class="w-full rounded-2xl px-5 py-4"
                                placeholder="Roll Number">
                        </div>
                    </div>
                </div>

                <div class="pt-10">
                    <button type="submit" id="saveProfileBtn"
                        class="btn-premium w-full py-5 rounded-2xl font-black text-lg">
                        Finalize Registry Identity
                    </button>
                </div>

                <div id="setupMessageBox" class="hidden p-6 rounded-2xl text-sm font-bold text-center border"></div>
            </form>
        </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let profileBase64 = null;

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('profilePreview').src = e.target.result;
                    profileBase64 = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const studentData = JSON.parse(localStorage.getItem('studentData'));
            if (!studentData) { window.location.href = 'login.html'; return; }

            const fields = [
                'name', 'fatherName', 'motherName', 'dob', 'personalEmail',
                'officialEmail', 'phone', 'college', 'course', 'branch',
                'specialization', 'semester', 'section', 'classRollNo',
                'enrollNo', 'universityRollNo'
            ];
            fields.forEach(f => {
                const el = document.getElementById(f);
                if (studentData[f] && el) {
                    // Special handling for selects to ensure values not in the list are shown
                    if (el.tagName === 'SELECT') {
                        const exists = Array.from(el.options).some(opt => opt.value === studentData[f]);
                        if (!exists) {
                            const newOpt = new Option(studentData[f], studentData[f], true, true);
                            el.add(newOpt);
                        }
                    }
                    el.value = studentData[f];
                }
            });

            if (studentData.profileImage) {
                document.getElementById('profilePreview').src = studentData.profileImage;
                profileBase64 = studentData.profileImage;
            }
        });

        document.getElementById('setupProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Use a local override for handleUpdateProfile if needed, or modify app.js
            // I will implement the logic globally in app.js, so I'll just call it
            await handleUpdateProfile(e, profileBase64);
        });
    </script>
</body>

</html>
