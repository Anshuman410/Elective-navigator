<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #050505;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-obsidian);
            color: #e2e8f0;
            min-height: screen;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.4;
            background: radial-gradient(circle at 10% 20%, var(--accent-indigo) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, var(--accent-purple) 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input, select {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
            color: white !important;
        }

        input:focus, select:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 py-20 bg-[#050505]">

    <div class="mesh-bg"></div>

    <div class="w-full max-w-2xl relative">
        <div class="glass-card p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-white transition-colors mb-10 group">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span class="text-sm font-bold uppercase tracking-widest">Back to Portal</span>
            </a>

            <div class="mb-12">
                <h1 class="text-4xl font-extrabold mb-3 tracking-tight">Create Profile</h1>
                <p class="text-slate-400 font-medium">Join the elite network of students optimizing their future.</p>
            </div>

            <form id="registerForm" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Full Name</label>
                    <input type="text" id="name" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="John Doe">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Student ID</label>
                    <input type="text" id="studentId" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="STU101">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Course</label>
                    <input type="text" id="course" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="B.Tech CSE">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Semester</label>
                    <select id="semester" required class="w-full rounded-2xl px-5 py-4 cursor-pointer appearance-none">
                        <option value="" disabled selected class="bg-[#050505]">Select Semester</option>
                        <option value="1" class="bg-[#050505]">1st Semester</option>
                        <option value="2" class="bg-[#050505]">2nd Semester</option>
                        <option value="3" class="bg-[#050505]">3rd Semester</option>
                        <option value="4" class="bg-[#050505]">4th Semester</option>
                        <option value="5" class="bg-[#050505]">5th Semester</option>
                        <option value="6" class="bg-[#050505]">6th Semester</option>
                        <option value="7" class="bg-[#050505]">7th Semester</option>
                        <option value="8" class="bg-[#050505]">8th Semester</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">University Roll No</label>
                    <input type="text" id="universityRollNo" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="200101001">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Section</label>
                    <input type="text" id="section" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="Section A">
                </div>

                <div class="space-y-2 md:col-span-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Secure Password</label>
                    <input type="password" id="password" required class="w-full rounded-2xl px-5 py-4 text-white placeholder-slate-600" placeholder="••••••••">
                </div>

                <div class="md:col-span-2 pt-6">
                    <button type="submit" id="submitBtn" class="btn-premium w-full py-5 rounded-2xl text-white font-black text-lg shadow-xl shadow-indigo-500/20">
                        Create Academic Profile
                    </button>
                </div>
                
                <div id="messageBox" class="md:col-span-2 hidden p-4 rounded-2xl text-sm font-bold text-center border"></div>
            </form>

            <p class="mt-12 text-center text-slate-500 text-sm font-medium">
                Already have an account? <a href="login.html" class="text-white hover:text-indigo-400 font-bold transition-colors">Sign In</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', handleRegister);
    </script>
</body>
</html>
</body>
</html>
