<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Elective Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-[#0a0c10] text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-[10%] left-[20%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px]"></div>
        <div class="absolute bottom-[10%] right-[20%] w-96 h-96 bg-purple-600/20 rounded-full blur-[128px]"></div>
    </div>

    <div class="w-full max-w-2xl glass p-8 rounded-[2rem] shadow-2xl relative">
        
        <a href="index.html" class="absolute top-8 left-8 text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>

        <div class="text-center mb-10 mt-6">
            <h2 class="text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">Student Registration</h2>
            <p class="text-slate-400 text-sm">Initialize your academic profile to access smart elective selection.</p>
        </div>

        <form id="registerForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Full Name</label>
                <input type="text" id="name" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Full Name">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Student ID</label>
                <input type="text" id="studentId" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Student ID (e.g. STU101)">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Course</label>
                <input type="text" id="course" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Course Name">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Semester</label>
                <select id="semester" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all appearance-none cursor-pointer">
                    <option value="" disabled selected class="bg-[#0a0c10]">Select Current Semester</option>
                    <option value="1" class="bg-[#0a0c10]">1st Semester</option>
                    <option value="2" class="bg-[#0a0c10]">2nd Semester</option>
                    <option value="3" class="bg-[#0a0c10]">3rd Semester</option>
                    <option value="4" class="bg-[#0a0c10]">4th Semester</option>
                    <option value="5" class="bg-[#0a0c10]">5th Semester</option>
                    <option value="6" class="bg-[#0a0c10]">6th Semester</option>
                    <option value="7" class="bg-[#0a0c10]">7th Semester</option>
                    <option value="8" class="bg-[#0a0c10]">8th Semester</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">University Roll No</label>
                <input type="text" id="universityRollNo" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Roll Number">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Section</label>
                <input type="text" id="section" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter Section (e.g. A)">
            </div>

            <div class="space-y-2 md:col-span-2">
                <label class="text-sm font-medium text-slate-300">Secure Password</label>
                <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="••••••••">
            </div>

            <div class="md:col-span-2 pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20 flex justify-center items-center gap-2">
                    Create Profile
                </button>
            </div>
            
            <div id="messageBox" class="md:col-span-2 hidden p-4 rounded-xl text-sm font-medium text-center"></div>

        </form>

        <p class="mt-8 text-center text-sm text-slate-400">
            Already registered? <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Sign in here</a>
        </p>

    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', handleRegister);
    </script>
</body>
</html>
</body>
</html>
